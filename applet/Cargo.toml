[package]
name = "hp-cosmic-charge-limit"
version = "0.1.0"
edition = "2021"
description = "COSMIC panel applet for the HP battery charge limiter"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
log = "0.4"
env_logger = "0.11"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "87ab8179e1bd9880239c340855ae8862034bd0e8"
default-features = false
features = ["applet-token"]
