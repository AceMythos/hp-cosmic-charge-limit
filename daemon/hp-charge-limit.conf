# hp-charge-limit configuration
#
# Charging stops at STOP and resumes at START. START must be lower than STOP.
# These are defaults: runtime changes from the applet are saved in
# /var/lib/hp-charge-limit/state.json and take precedence.
START=75
STOP=80

# Poll interval in seconds (minimum 5).
INTERVAL=30

# Start with the limiter on.
ENABLED=true

# Group allowed to talk to the control socket (the applet's user).
# Empty means only root. Set this to your username or a group you belong to.
SOCKET_GROUP=
